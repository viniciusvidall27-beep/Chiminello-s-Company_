# render.yaml — Deploy no Render.com (RECOMENDADO para Flask)
# 1. Crie conta em https://render.com
# 2. New > Web Service > conecte seu GitHub
# 3. O Render detecta automaticamente este arquivo

services:
  - type: web
    name: chiminello
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "0"
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
